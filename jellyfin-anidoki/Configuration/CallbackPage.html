<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} · AniDōki</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #101010; color: #f5f5f5; font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
a { color: #3dbbec; }
.doki-cb-bar { height: 64px; padding: 0 32px; display: flex; align-items: center; gap: 10px; background: #181818; border-bottom: 1px solid #2a2a2a; }
.doki-cb-bar img { width: 30px; height: 30px; }
.doki-cb-bar span { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.doki-cb-main { flex: 1 1 auto; padding: 48px 16px 40px; display: flex; justify-content: center; }
.doki-cb-column { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 28px; }
.doki-cb-hero { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.doki-cb-logos { display: flex; align-items: center; justify-content: center; gap: 20px; }
.doki-cb-provider { width: 72px; height: 72px; padding: 14px; border-radius: 18px; background: #ffffff; display: flex; align-items: center; justify-content: center; }
.doki-cb-provider.doki-cb-unknown { background: #1e1e1e; border: 1px solid #333333; color: #b9b9b9; }
.doki-cb-provider img, .doki-cb-provider svg { width: 100%; height: 100%; object-fit: contain; }
.doki-cb-badge { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.doki-cb-badge.doki-cb-success { background: #34d399; color: #062a1d; }
.doki-cb-badge.doki-cb-warning { background: #fbbf24; color: #2e2104; }
.doki-cb-badge.doki-cb-error { background: #f87171; color: #340a0e; }
.doki-cb-us { display: flex; align-items: center; gap: 6px; padding: 7px; border-radius: 22px; background: #1e1e1e; border: 1px solid #333333; color: #b9b9b9; }
.doki-cb-us .doki-cb-jellyfin { width: 56px; height: 56px; padding: 12px; border-radius: 15px; background: #101010; }
.doki-cb-us .doki-cb-anidoki { width: 56px; height: 56px; border-radius: 15px; object-fit: cover; }
.doki-cb-hero h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 600; }
.doki-cb-hero p { margin: 0; max-width: 520px; font-size: 15px; line-height: 1.6; color: #b9b9b9; }
.doki-cb-account { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 1px solid #333333; border-radius: 12px; background: #181818; }
.doki-cb-avatar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; background: #00a4dc; color: #04141c; display: flex; align-items: center; justify-content: center; }
.doki-cb-who { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.doki-cb-who strong { font-size: 15px; font-weight: 500; }
.doki-cb-who span, .doki-cb-state small { font-size: 13px; font-weight: 400; color: #b9b9b9; }
.doki-cb-state { display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-size: 13px; font-weight: 600; }
.doki-cb-state.doki-cb-success { color: #6ee7b7; }
.doki-cb-state.doki-cb-warning { color: #fcd34d; }
.doki-cb-state.doki-cb-error { color: #fca5a5; }
.doki-cb-field { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; border: 1px solid #333333; border-radius: 12px; background: #181818; }
.doki-cb-field label { font-size: 14px; font-weight: 600; }
.doki-cb-copy { display: flex; gap: 8px; }
.doki-cb-copy input { flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3a3a; background: #101010; color: #f5f5f5; font: 13px ui-monospace, "Noto Sans Mono", monospace; }
.doki-cb-note { display: flex; gap: 14px; padding: 18px 20px; border-radius: 12px; background: #1e1e1e; }
.doki-cb-note > svg { flex: 0 0 auto; margin-top: 1px; color: #b9b9b9; }
.doki-cb-note div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.doki-cb-note h2 { margin: 0; font-size: 15px; font-weight: 600; }
.doki-cb-note ul, .doki-cb-note ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.55; color: #b9b9b9; }
.doki-cb-note p { margin: 0; font-size: 14px; line-height: 1.55; color: #b9b9b9; }
.doki-cb-note details { font-size: 13px; color: #b9b9b9; }
.doki-cb-note summary { cursor: pointer; color: #f5f5f5; font-weight: 500; }
.doki-cb-note code { display: block; margin-top: 8px; font: 12px ui-monospace, "Noto Sans Mono", monospace; overflow-wrap: anywhere; }
.doki-cb-footer { padding: 20px 16px 28px; background: #181818; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.doki-cb-footer p { margin: 0; width: 100%; max-width: 640px; font-size: 13px; line-height: 1.55; color: #b9b9b9; text-align: center; }
.doki-cb-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.doki-cb-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 22px; border-radius: 8px; border: 1px solid #4a4a4a; background: transparent; color: #f5f5f5; font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; cursor: pointer; }
.doki-cb-button.doki-cb-primary { border-color: #00a4dc; background: #00a4dc; color: #04141c; font-weight: 600; }
.doki-cb-button:focus-visible, .doki-cb-copy input:focus-visible, .doki-cb-note summary:focus-visible { outline: 2px solid #7fd3f3; outline-offset: 2px; }
.doki-cb-small { min-height: 44px; padding: 10px 14px; font-size: 14px; background: #262626; }
[hidden] { display: none !important; }
@media (max-width: 520px) {
  .doki-cb-bar { padding: 0 16px; }
  .doki-cb-main { padding-top: 32px; }
  .doki-cb-logos { gap: 12px; }
  .doki-cb-provider { width: 60px; height: 60px; padding: 12px; }
  .doki-cb-us .doki-cb-jellyfin, .doki-cb-us .doki-cb-anidoki { width: 46px; height: 46px; }
  .doki-cb-account { flex-wrap: wrap; }
  .doki-cb-state { align-items: flex-start; text-align: left; width: 100%; padding-left: 54px; }
  .doki-cb-actions { width: 100%; flex-direction: column; }
}
</style>
</head>
<body>
<header class="doki-cb-bar">
  <img src="{{assets}}jellyfin.svg" alt="">
  <span>Jellyfin</span>
</header>
<main class="doki-cb-main">
  <div class="doki-cb-column">
    <div class="doki-cb-hero">
      <div class="doki-cb-logos">
        {{providerLogo}}
        <div class="doki-cb-badge doki-cb-{{tone}}" role="img" aria-label="{{badgeLabel}}">{{badgeIcon}}</div>
        <div class="doki-cb-us">
          <img class="doki-cb-jellyfin" src="{{assets}}jellyfin.svg" alt="Jellyfin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <img class="doki-cb-anidoki" src="{{assets}}anidoki-avatar.png" alt="AniDōki">
        </div>
      </div>
      <h1>{{heading}}</h1>
      {{lead}}
    </div>
    {{body}}
  </div>
</main>
<footer class="doki-cb-footer">
  <p>{{footer}}</p>
  <div class="doki-cb-actions">
    <a class="doki-cb-button doki-cb-primary" href="{{settingsHref}}">{{primary}}</a>
    <button class="doki-cb-button" type="button" data-close>Close tab</button>
  </div>
  <p data-close-hint hidden>Your browser kept this tab open. You can close it yourself.</p>
</footer>
<script>
document.querySelector('[data-close]').addEventListener('click', () => {
  window.close();
  setTimeout(() => { document.querySelector('[data-close-hint]').hidden = false; }, 300);
});
for (const button of document.querySelectorAll('[data-copy]')) {
  button.addEventListener('click', async () => {
    const input = document.getElementById(button.dataset.copy);
    input.select();
    try { await navigator.clipboard.writeText(input.value); button.lastChild.textContent = ' Copied'; }
    catch { document.execCommand('copy'); }
  });
}
</script>
</body>
</html>
