name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate release metadata
        run: python3 scripts/release.py check
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Restore dependencies
        run: dotnet restore jellyfin-anidoki.sln
      - name: Build solution
        run: dotnet build jellyfin-anidoki.sln --configuration Release --no-restore
      - name: Run unit tests
        run: >-
          dotnet test jellyfin-anidoki-unit-tests/jellyfin-anidoki-unit-tests.csproj
          --configuration Release --no-build --logger trx
          --results-directory test-results
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: ignore
