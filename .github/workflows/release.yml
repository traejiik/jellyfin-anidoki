name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose installation feed should be updated
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag belongs to development history
        run: |
          git fetch origin development
          git merge-base --is-ancestor HEAD origin/development
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Apply tag version to build metadata
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG"
      - name: Restore dependencies
        run: dotnet restore jellyfin-anidoki.sln
      - name: Build solution
        run: dotnet build jellyfin-anidoki.sln --configuration Release --no-restore
      - name: Run unit tests
        run: >-
          dotnet test jellyfin-anidoki-unit-tests/jellyfin-anidoki-unit-tests.csproj
          --configuration Release --no-build --logger trx
          --results-directory test-results
      - name: Publish plugin DLL
        run: >-
          dotnet publish jellyfin-anidoki/jellyfin-anidoki.csproj
          --configuration Release --no-build --no-restore
          --output "$RUNNER_TEMP/anidoki-publish"
      - name: Generate changelog from merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          gh api --method POST "repos/$RELEASE_REPOSITORY/releases/generate-notes"
          -f tag_name="$RELEASE_TAG" --jq '.body'
          > "$RUNNER_TEMP/anidoki-changelog.md"
      - name: Package plugin and generate checksums and manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/release.py package --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --publish-dir "$RUNNER_TEMP/anidoki-publish"
          --changelog-file "$RUNNER_TEMP/anidoki-changelog.md" --output dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.zip dist/*.md5 dist/*.sha256 dist/manifest.json \
            --verify-tag --title "AniDoki $RELEASE_TAG" \
            --notes-file dist/release-notes.md
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: test-results/*.trx
          if-no-files-found: ignore

  update-manifest:
    name: Update installation feed
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: installation-feed-development
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - name: Download the published installation manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Release is still a draft") else true end'
          gh release download "$RELEASE_TAG" --pattern manifest.json --dir "$RUNNER_TEMP/released-manifest"
      - name: Check out the development feed with its deploy key
        uses: actions/checkout@v6
        with:
          ref: development
          path: feed
          ssh-key: ${{ secrets.RELEASE_FEED_SSH_KEY }}
      - name: Commit only the released manifest to development
        run: |
          git -C feed config user.name "github-actions[bot]"
          git -C feed config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C feed fetch origin development
            git -C feed reset --hard origin/development
            python3 automation/scripts/release.py update-feed \
              --manifest feed/manifest.json --released "$RUNNER_TEMP/released-manifest/manifest.json"
            git -C feed add -- manifest.json
            if git -C feed diff --cached --quiet; then
              echo "Installation feed is already current."
              exit 0
            fi
            git -C feed commit -m "chore: update installation feed for $RELEASE_TAG"
            if git -C feed push origin HEAD:development; then
              exit 0
            fi
          done
          echo "Could not update development after three attempts."
          exit 1
